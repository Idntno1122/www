<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报备小站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        accent: '#22d3ee',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass {
                background: rgba(30, 41, 59, 0.7);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255,255,255,0.1);
            }
            .animate-pulse-slow {
                animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            .card-shadow {
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            }
        }
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height:6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen">
    
    <div id="authPage" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass rounded-2xl p-8 w-full max-w-md card-shadow">
            <div class="flex mb-6 border-b border-slate-600">
                <button onclick="switchAuthTab('login')" id="loginTab" class="py-2 px-4 border-b-2 border-primary text-primary font-semibold">登录</button>
                <button onclick="switchAuthTab('register')" id="regTab" class="py-2 px-4 text-slate-400">注册</button>
            </div>
            
            <div id="loginForm">
                <div class="mb-4">
                    <label class="block mb-2 text-sm">用户ID</label>
                    <input type="text" id="loginUser" class="w-full bg-slate-800 rounded-lg p-3 outline-none focus:ring-2 ring-primary/50" placeholder="输入你的自定义ID">
                </div>
                <div class="mb-6">
                    <label class="block mb-2 text-sm">密码</label>
                    <input type="password" id="loginPwd" class="w-full bg-slate-800 rounded-lg p-3 outline-none focus:ring-2 ring-primary/50" placeholder="输入密码">
                </div>
                <button onclick="login()" class="w-full bg-primary hover:bg-primary/80 rounded-lg py-3 font-bold transition">登录系统</button>
                <p id="loginTip" class="mt-3 text-red-400 text-sm hidden"></p>
                <p class="mt-2 text-slate-400 text-sm">⚠️必须先注册账号才能登录</p>
            </div>
            
            <div id="registerForm" class="hidden">
                <div class="mb-4">
                    <label class="block mb-2 text-sm">自定义唯一ID（用来加好友，不可重复）</label>
                    <input type="text" id="regId" class="w-full bg-slate-800 rounded-lg p-3 outline-none focus:ring-2 ring-primary/50" placeholder="英文+数字，例如：birthday001">
                </div>
                <div class="mb-4">
                    <label class="block mb-2 text-sm">设置密码</label>
                    <input type="password" id="regPwd" class="w-full bg-slate-800 rounded-lg p-3 outline-none focus:ring-2 ring-primary/50" placeholder="自定义密码">
                </div>
                <div class="mb-6">
                    <label class="block mb-2 text-sm">展示昵称</label>
                    <input type="text" id="regNick" class="w-full bg-slate-800 rounded-lg p-3 outline-none focus:ring-2 ring-primary/50" placeholder="别人看到你的名字">
                </div>
                <button onclick="register()" class="w-full bg-accent hover:bg-accent/80 rounded-lg py-3 font-bold text-slate-900 transition">注册账号</button>
                <p id="regTip" class="mt-3 text-red-400 text-sm hidden"></p>
            </div>
        </div>
    </div>

    
    <div id="mainPage" class="hidden">
      
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex flex-wrap justify-between items-center">
            <h1 class="text-xl font-bold text-accent"><i class="fa fa-calendar-check-o mr-2"></i>报备e站</h1>
            <div class="flex gap-3 items-center flex-wrap mt-2 md:mt-0">
                <span id="userNick" class="text-sm text-slate-300"></span>
                <span id="showUid" class="text-xs text-slate-400"></span>
                <button onclick="switchPanel('home')" class="px-3 py-1 rounded hover:bg-slate-700">主页</button>
                <button onclick="switchPanel('checkin')" class="px-3 py-1 rounded hover:bg-slate-700">打卡</button>
                <button onclick="switchPanel('countdown')" class="px-3 py-1 rounded hover:bg-slate-700">倒数日</button>
                <button onclick="switchPanel('wish')" class="px-3 py-1 rounded hover:bg-slate-700">许愿池</button>
                <button onclick="switchPanel('food')" class="px-3 py-1 rounded hover:bg-slate-700">每日美食</button>
                <button onclick="switchPanel('moment')" class="px-3 py-1 rounded hover:bg-slate-700">朋友圈</button>
                <button onclick="switchPanel('friend')" class="px-3 py-1 rounded hover:bg-slate-700">好友</button>
                <button onclick="switchPanel('team')" class="px-3 py-1 rounded hover:bg-slate-700">组队</button>
                <button onclick="switchPanel('memo')" class="px-3 py-1 rounded hover:bg-slate-700">备忘录</button>
                <button onclick="switchPanel('history')" class="px-3 py-1 rounded hover:bg-slate-700">打卡记录</button>
                <button onclick="logout()" class="px-3 py-1 rounded bg-red-600/60 hover:bg-red-600">退出</button>
            </div>
        </nav>

        <div class="container mx-auto p-4">
            
            <div id="panel-home" class="panel">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                    <div class="glass rounded-xl p-6 card-shadow">
                        <h2 class="text-lg font-semibold mb-4"><i class="fa fa-cloud mr-2 text-accent"></i>本地天气预报</h2>
                        <div id="weatherBox">
                            <p class="text-slate-400">正在定位你的城市...</p>
                        </div>
                    </div>
                    <div class="glass rounded-xl p-6 card-shadow">
                        <h2 class="text-lg font-semibold mb-4"><i class="fa fa-line-chart mr-2 text-accent"></i>今日打卡概览</h2>
                        <div id="todaySummary">
                            <p class="text-slate-300">今日打卡：0 / 三餐+学习</p>
                            <p class="text-slate-400 mt-2">前往打卡面板 完成今日报备</p>
                        </div>
                        <div class="mt-4">
                            <h3 class="font-medium">当前激活倒数目标</h3>
                            <div id="homeCountdownList" class="mt-2"></div>
                        </div>
                    </div>
                </div>
                <div class="glass rounded-xl p-6 mt-6 card-shadow">
                    <h2 class="text-lg font-semibold mb-4"><i class="fa fa-heart text-rose-400 mr-2"></i>小鼓励</h2>
                    <div id="wishEncourageBox" class="text-lg text-slate-200">
                        <p>写下心愿，主页会在这里生成专属鼓励✨</p>
                    </div>
                </div>
                <div class="glass rounded-xl p-6 mt-6 card-shadow">
                    <h2 class="text-lg font-semibold mb-4"><i class="fa fa-book mr-2 text-accent"></i>每日心得</h2>
                    <textarea id="dailyThought" class="w-full bg-slate-800 rounded-lg p-4 h-36 outline-none resize-none" placeholder="在这里写下今天的感想、收获与碎碎念..."></textarea>
                    <button onclick="saveThought()" class="mt-3 bg-primary px-4 py-2 rounded-lg hover:bg-primary/80">保存心得</button>
                    <div id="thoughtHistory" class="mt-4"></div>
                </div>
            </div>

            
            <div id="panel-checkin" class="panel hidden">
                <div class="glass rounded-xl p-6 mt-4 card-shadow">
                    <h2 class="text-lg font-semibold mb-4"><i class="fa fa-check-square-o mr-2 text-accent"></i>每日报备打卡</h2>
                    <div class="mb-4">
                        <label class="block mb-2">选择所属倒数目标</label>
                        <select id="checkinTarget" class="w-full bg-slate-800 p-3 rounded-lg">
                            <option value="">无目标（普通打卡）</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="breakfast">早餐完成
                            </label>
                        </div>
                        <div>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="lunch">午餐完成
                            </label>
                        </div>
                        <div>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="dinner">晚餐完成
                            </label>
                        </div>
                        <div>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="study">今日学习完成
                            </label>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block mb-2">打卡备注</label>
                        <textarea id="checkinNote" class="w-full bg-slate-800 p-3 rounded-lg h-24 resize-none" placeholder="写点说明，学习内容、三餐情况..."></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="block mb-2">上传附件（支持多文件，任意类型）</label>
                        <input type="file" multiple id="fileUpload" class="w-full bg-slate-800 p-3 rounded-lg">
                        <div id="filePreview" class="mt-2 flex flex-wrap gap-2"></div>
                    </div>
                    <div class="mb-6">
                        <label class="mr-3"><input type="radio" name="checkMode" value="public">公开打卡</label>
                        <label class="mr-3"><input type="radio" name="checkMode" value="team">队内可见</label>
                        <label class="mr-3"><input type="radio" name="checkMode" value="friend">仅好友可见</label>
                        <label><input type="radio" name="checkMode" value="private" checked>仅自己私密</label>
                    </div>
                    <button onclick="submitCheckin()" class="bg-primary px-5 py-3 rounded-lg hover:bg-primary/80 font-semibold">提交今日打卡报备</button>
                </div>
            </div>

            
            <div id="panel-countdown" class="panel hidden">
                <div class="glass rounded-xl p-6 mt-4 card-shadow">
                    <h2 class="text-lg font-semibold mb-4"><i class="fa fa-hourglass-half mr-2 text-accent"></i>新增倒数目标</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block mb-2">目标名称</label>
                            <input id="cdName" class="w-full bg-slate-800 p-3 rounded-lg" placeholder="例如：考试、比赛">
                        </div>
                        <div>
                            <label class="block mb-2">目标日期</label>
                            <input type="date" id="cdDate" class="w-full bg-slate-800 p-3 rounded-lg">
                        </div>
                    </div>
                    <button onclick="addCountdown()" class="bg-accent text-slate-900 px-4 py-2 rounded-lg hover:bg-accent/80 font-semibold">添加倒数目标</button>
                    <div class="mt-6">
                        <h3 class="font-semibold mb-3">我的全部目标列表</h3>
                        <div id="cdList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    </div>
                </div>
            </div>

            
            <div id="panel-wish" class="panel hidden">
                <div class="glass rounded-xl p-6 mt-4 card-shadow">
                    <h2 class="text-lg font-semibold mb-4"><i class="fa fa-star mr-2 text-accent"></i>许愿池</h2>
                    <textarea id="wishInput" class="w-full bg-slate-800 p-4 rounded-lg h-28 resize-none" placeholder="写下你的心愿..."></textarea>
                    <div class="my-4">
                        <label class="mr-3"><input type="radio" name="wishMode" value="public">公开心愿</label>
                        <label class="mr-3"><input type="radio" name="wishMode" value="team">队内可见</label>
                        <label class="mr-3"><input type="radio" name="wishMode" value="friend">仅好友可见</label>
                        <label><input type="radio" name="wishMode" value="private" checked>私密心愿</label>
                    </div>
                    <button onclick="postWish()" class="mt-1 bg-primary px-4 py-2 rounded-lg hover:bg-primary/80">投递心愿</button>
                    <div class="mt-6" id="wishPool"></div>
                </div>
            </div>

            
            <div id="panel-food" class="panel hidden">
                <div class="glass rounded-xl p-6 mt-4 card-shadow">
                    <h2 class="text-lg font-semibold mb-4"><i class="fa fa-cutlery mr-2 text-accent"></i>每日美食分享</h2>
                    <textarea id="foodDesc" class="w-full bg-slate-800 p-4 rounded-lg h-28 resize-none" placeholder="描述美食：甜品、零食、小吃、下午茶等"></textarea>
                    <div class="my-3">
                        <label class="block mb-2">上传美食图片（可选）</label>
                        <input type="file" id="foodImgUpload" accept="image/*" class="w-full bg-slate-800 p-3 rounded-lg">
                        <div id="foodImgPreview" class="mt-3"></div>
                    </div>
                    <div class="my-4">
                        <label class="mr-3"><input type="radio" name="foodMode" value="public">公开美食</label>
                        <label class="mr-3"><input type="radio" name="foodMode" value="team">队内可见</label>
                        <label class="mr-3"><input type="radio" name="foodMode" value="friend">仅好友可见</label>
                        <label><input type="radio" name="foodMode" value="private" checked>私密美食</label>
                    </div>
                    <button onclick="submitFood()" class="bg-primary px-4 py-2 rounded-lg hover:bg-primary/80">发布美食</button>
                    <div class="mt-6" id="foodPool"></div>
                </div>
            </div>

            
            <div id="panel-moment" class="panel hidden">
                <div class="glass rounded-xl p-6 mt-4 card-shadow">
                    <h2 class="text-lg font-semibold mb-4"><i class="fa fa-comment mr-2 text-accent"></i>朋友圈</h2>
                    <textarea id="momentText" class="w-full bg-slate-800 p-4 rounded-lg h-28 resize-none" placeholder="发布朋友圈文字内容"></textarea>
                    <div class="my-3">
                        <label class="block mb-2">上传文件（不限数量，任意文件）</label>
                        <input type="file" multiple id="momentFileInput" class="w-full bg-slate-800 p-3 rounded-lg">
                        <div id="momentFilePreview" class="mt-3 flex flex-wrap gap-3"></div>
                    </div>
                    <div class="my-4">
                        <label class="mr-2"><input type="radio" name="momentAuth" value="public">公开</label>
                        <label class="mr-2"><input type="radio" name="momentAuth" value="team">队内可见</label>
                        <label class="mr-2"><input type="radio" name="momentAuth" value="friend">仅好友可见</label>
                        <label><input type="radio" name="momentAuth" value="private" checked>仅自己私密</label>
                    </div>
                    <button onclick="publishMoment()" class="bg-primary px-4 py-2 rounded-lg hover:bg-primary/80">发布朋友圈</button>
                </div>
                <div class="glass rounded-xl p-6 mt-6 card-shadow">
                    <h3 class="font-semibold mb-4">朋友圈动态流</h3>
                    <div id="momentList"></div>
                </div>
            </div>

            
            <div id="panel-friend" class="panel hidden">
                <div class="glass rounded-xl p-6 mt-4 card-shadow">
                    <h2 class="text-lg font-semibold mb-4"><i class="fa fa-users mr-2 text-accent"></i>好友管理</h2>
                    <div class="flex gap-3 mb-6">
                        <input id="searchFriendId" class="flex-1 bg-slate-800 p-3 rounded-lg" placeholder="输入对方用户ID搜索好友">
                        <button onclick="searchUserById()" class="bg-primary px-4 rounded-lg hover:bg-primary/80">搜索</button>
                    </div>
                    <div id="searchUserResult" class="mb-6"></div>
                    <h3 class="font-semibold mb-3">待处理好友申请</h3>
                    <div id="applyList" class="mb-6"></div>
                    <h3 class="font-semibold mb-3">我的好友列表</h3>
                    <div id="myFriendList"></div>
                </div>
            </div>

        
            <div id="panel-team" class="panel hidden">
                <div class="glass rounded-xl p-6 mt-4 card-shadow">
                    <h2 class="text-lg font-semibold mb-4"><i class="fa fa-users mr-2 text-accent"></i>组队系统</h2>
                    <div id="teamCreateBox">
                        <button onclick="createTeam()" class="bg-accent text-slate-900 px-4 py-2 rounded-lg hover:bg-accent/80 font-semibold">创建新队伍（生成6位组队码）</button>
                        <div class="my-4 flex gap-3">
                            <input id="joinTeamCode" class="flex-1 bg-slate-800 p-3 rounded-lg" placeholder="输入6位组队码加入队伍">
                            <button onclick="joinTeam()" class="bg-primary px-4 rounded-lg hover:bg-primary/80">加入队伍</button>
                        </div>
                    </div>
                    <div id="teamInfoBox" class="hidden">
                        <h3 class="font-bold text-accent">当前队伍信息</h3>
                        <p class="my-2">队伍码：<span id="teamCodeShow" class="text-xl text-yellow-300"></span></p>
                        <p class="my-2">队长ID：<span id="teamLeaderShow"></span></p>
                        <h4 class="mt-4 font-semibold">队内成员列表</h4>
                        <div id="teamMemberList" class="my-3"></div>
                        <div id="teamOperateBtn" class="my-4"></div>
                        <button onclick="leaveTeam()" class="bg-red-500 px-3 py-1 rounded">退出队伍</button>
                    </div>
                </div>
            </div>

        
            <div id="panel-memo" class="panel hidden">
                <div class="glass rounded-xl p-6 mt-4 card-shadow">
                    <h2 class="text-lg font-semibold mb-4"><i class="fa fa-sticky-note mr-2 text-accent"></i>私人备忘录</h2>
                    <input id="memoTitle" class="w-full bg-slate-800 p-3 rounded-lg mb-3" placeholder="备忘录标题">
                    <textarea id="memoContent" class="w-full bg-slate-800 p-4 rounded-lg h-40 resize-none" placeholder="记录待办、笔记、重要事项..."></textarea>
                    <button onclick="addMemo()" class="mt-2 bg-primary px-4 py-2 rounded-lg hover:bg-primary/80">新建备忘录</button>
                    <div class="mt-6" id="memoList"></div>
                </div>
            </div>

           
            <div id="panel-history" class="panel hidden">
                <div class="glass rounded-xl p-6 mt-4 card-shadow">
                    <h2 class="text-lg font-semibold mb-4"><i class="fa fa-history mr-2 text-accent"></i>打卡历史记录</h2>
                    <div class="mb-4">
                        <label class="mr-4"><input type="radio" name="historyMode" value="all" checked>全部（公开+私密）</label>
                        <label class="mr-4"><input type="radio" name="historyMode" value="public">仅看公开打卡</label>
                        <label><input type="radio" name="historyMode" value="private">仅私密打卡</label>
                    </div>
                    <div id="historyList"></div>
                </div>
            </div>
        </div>
    </div>

    
    <div id="encourageModal" class="fixed inset-0 bg-black/60 hidden z-[9999] flex items-center justify-center">
        <div class="glass rounded-xl p-8 text-center card-shadow max-w-md">
            <h2 class="text-2xl font-bold text-accent mb-3">🎉 太棒啦！打卡完成</h2>
            <p id="encourageText" class="text-lg mb-6">坚持下去，目标一定达成！</p>
            <button onclick="closeModal()" class="bg-primary px-6 py-2 rounded-lg">继续加油</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        let fileArr = [];
        let foodImageBase64 = "";
        let momentFiles = [];
        const encourageList = [
            "坚持每一天，你超厉害！",
            "今日任务拿下，离目标更近一步✨",
            "三餐规律，稳步学习，未来可期",
            "所有的努力都会有回报，继续向前！",
            "保持节奏，胜利就在前方",
            "今天的你，比昨天更好！"
        ]
        const wishEncourageTemplate = [
            "你许下心愿：【{wish}】，相信你日复一日的坚持，终会如愿。",
            "心愿「{wish}」正在等待实现，每一次打卡，都在靠近它。",
            "还记得你的心愿：{wish}，不要着急，时间会给你答案。",
            "怀揣心愿「{wish}」稳步前行，你付出的努力都算数。",
            "心愿：{wish}，慢慢来，顶峰相见。"
        ]

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => resolve(event.target.result);
                reader.onerror = () => reject(new Error(`读取文件失败: ${file.name}`));
                reader.readAsDataURL(file);
            });
        }

        window.onload = ()=>{
            checkLoginStatus();
            bindFileInput();
            bindFoodImageInput();
            bindMomentFileInput();
            getLocationWeather();
        }

        function switchAuthTab(tab){
            if(tab === 'login'){
                document.getElementById('loginTab').classList.add('border-b-2','border-primary','text-primary');
                document.getElementById('regTab').classList.remove('border-b-2','border-primary','text-primary');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
            }else{
                document.getElementById('regTab').classList.add('border-b-2','border-primary','text-primary');
                document.getElementById('loginTab').classList.remove('border-b-2','border-primary','text-primary');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('loginForm').classList.add('hidden');
            }
        }

        
        function register(){
            const uid = document.getElementById('regId').value.trim();
            const pwd = document.getElementById('regPwd').value.trim();
            const nick = document.getElementById('regNick').value.trim();
            const tip = document.getElementById('regTip');
            tip.classList.add('hidden');
            if(!uid||!pwd||!nick){
                tip.innerText = "ID、密码、昵称不能为空";
                tip.classList.remove('hidden');
                return;
            }
            const users = JSON.parse(localStorage.getItem("users") || "{}");
            if(users[uid]){
                tip.innerText = "该用户ID已被占用，请更换";
                tip.classList.remove('hidden');
                return;
            }
            users[uid] = {pwd,nick};
            localStorage.setItem("users", JSON.stringify(users));
            tip.innerText = "✅注册成功！切换到登录页登录";
            tip.classList.remove('hidden');
        }

        function sendFriendApply(targetUid){
            const friendData = JSON.parse(localStorage.getItem("friendData")||"{}");
            if(!friendData[targetUid]) friendData[targetUid] = {list:[], apply:[]};
            const hasApply = friendData[targetUid].apply.some(x=>x.from === currentUser.uid);
            const isFriend = friendData[currentUser.uid]?.list.includes(targetUid);
            if(hasApply) return alert("已经发送过申请");
            if(isFriend) return alert("对方已经是你的好友");
            friendData[targetUid].apply.push({from:currentUser.uid, time:new Date().toLocaleString()});
            localStorage.setItem("friendData", JSON.stringify(friendData));
            alert("好友申请已发送");
        }

            friendData[currentUser.uid].list.push(fromUid);

            const teamList = JSON.parse(localStorage.getItem("teamList")||"{}");
            const team = teamList[code];
            team.members = team.members.filter(u=>u!==currentUser.uid);
       
            if(team.leader === currentUser.uid || team.members.length ===0){
                delete teamList[code];

            delete teamList[code];
            localStorage.setItem("teamList", JSON.stringify(teamList));
            localStorage.removeItem("userTeam_"+currentUser.uid);
            alert("队伍已解散");
            renderTeamPanel();
        }
        function renderTeamPanel(){
            const code = getMyTeamCode();
            if(!code){
                document.getElementById("teamCreateBox").classList.remove("hidden");
                document.getElementById("teamInfoBox").classList.add("hidden");
                return;
            }
            document.getElementById("teamCreateBox").classList.add("hidden");
            document.getElementById("teamInfoBox").classList.remove("hidden");
            const teamList = JSON.parse(localStorage.getItem("teamList")||"{}");
            const team = teamList[code];
            const users = JSON.parse(localStorage.getItem("users")||"{}");
            document.getElementById("teamCodeShow").innerText = code;
            document.getElementById("teamLeaderShow").innerText = team.leader;
            let memberHtml = "";
            team.members.forEach(mUid=>{
                const u = users[mUid];
                let kickBtn = "";
                if(team.leader === currentUser.uid && mUid!==currentUser.uid){
                    kickBtn = `<button onclick="kickMember('${mUid}')" class="text-red-400 text-sm ml-3">踢出</button>`;
                }
                memberHtml += `<div class="bg-slate-800 p-2 rounded my-1">${u.nick}(${mUid}) ${kickBtn}</div>`;
            })
            document.getElementById("teamMemberList").innerHTML = memberHtml;
            let opHtml = "";
            if(team.leader === currentUser.uid){
                opHtml = `<button onclick="disbandTeam()" class="bg-red-600 px-3 py-1 rounded">解散队伍</button>`;
            }
            document.getElementById("teamOperateBtn").innerHTML = opHtml;
        }

       
        function addMemo(){
            const title = document.getElementById('memoTitle').value.trim();
            const content = document.getElementById('memoContent').value.trim();
            if(!title||!content) return alert("标题和内容不能为空");
            const memoList = JSON.parse(localStorage.getItem("memoList")||"[]");
            memoList.push({
                id:Date.now(),
                uid:currentUser.uid,
                title,
                content,
                time:new Date().toLocaleString()
            })
            localStorage.setItem("memoList", JSON.stringify(memoList));
            document.getElementById('memoTitle').value = "";
            document.getElementById('memoContent').value = "";
            renderMemoList();
        }
        function renderMemoList(){
            const memoList = JSON.parse(localStorage.getItem("memoList")||"[]");
            const myMemo = memoList.filter(x=>x.uid === currentUser.uid);
            let html = "";
            myMemo.reverse().forEach(item=>{
                html += `
                <div class="bg-slate-800 p-4 rounded-lg mb-3">
                    <h3 class="font-bold text-accent">${item.title}</h3>
                    <p class="my-2">${item.content}</p>
                    <span class="text-xs text-slate-400">${item.time}</span>
                </div>
                `
            })
            document.getElementById('memoList').innerHTML = html;
        }

     
        function renderHistory(){
            const allCheckins = JSON.parse(localStorage.getItem("allCheckins")||"[]");
            const friends = getFriendUidList();
            const myTeamCode = getMyTeamCode();
            const modeSel = document.querySelector('input[name="historyMode"]:checked').value;
            let html = "";
            allCheckins.reverse().forEach(item=>{
                let canSee = false;
                if(item.mode === 'public') canSee = true;
                if(item.mode === 'friend' && friends.includes(item.uid)) canSee = true;
                if(item.mode === 'team' && myTeamCode && item.teamId === myTeamCode) canSee = true;
                if(item.mode === 'private' && item.uid === currentUser.uid) canSee = true;
                if(!canSee) return;
                if(modeSel === "public" && item.mode !== "public") return;
                if(modeSel === "private" && item.mode !== "private") return;
                let tagMap = {public:"公开",team:"队内",friend:"仅好友",private:"私密"};
                const files = Array.isArray(item.files) ? item.files : [];
                const filesText = files.length ? files.join(", ") : "无";
                html += `
                <div class="bg-slate-800 p-4 rounded-lg mb-3">
                    <div class="flex justify-between">
                        <span class="text-accent font-bold">${item.nick}(${item.uid})</span>
                        <span class="text-xs text-slate-400">${item.time} | ${tagMap[item.mode]}</span>
                    </div>
                    <p>早餐:${item.breakfast?"✅":"❌"} 午餐:${item.lunch?"✅":"❌"} 晚餐:${item.dinner?"✅":"❌"} 学习:${item.study?"✅":"❌"}</p>
                    <p class="mt-2">备注：${item.note||"无备注"}</p>
                    <p class="mt-1 text-slate-400">附件文件：${filesText}</p>
                </div>
                `
            })
            document.getElementById('historyList').innerHTML = html;
        }

        
        function saveThought(){
            const txt = document.getElementById("dailyThought").value.trim();
            if(!txt) return alert("内容不能为空");
            const thoughtList = JSON.parse(localStorage.getItem("thoughtList")||"[]");
            thoughtList.push({uid:currentUser.uid,time:new Date().toLocaleString(),content:txt});
            localStorage.setItem("thoughtList", JSON.stringify(thoughtList));
            loadDailyThought();
        }
        function loadDailyThought(){
            const thoughtList = JSON.parse(localStorage.getItem("thoughtList")||"[]");
            const myThought = thoughtList.filter(x=>x.uid === currentUser.uid).reverse();
            let html = "";
            myThought.slice(0,5).forEach(item=>{
                html += `<div class="bg-slate-800 p-3 rounded my-2"><p>${item.content}</p><span class="text-xs text-slate-400">${item.time}</span></div>`
            })
            document.getElementById("thoughtHistory").innerHTML = html;
        }
    </script>
